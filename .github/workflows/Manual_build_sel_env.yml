name: Manual Build (Select Environment)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to build from'
        required: true
        default: 'dev'
        type: string
      version_name:
        description: 'Version name (Ninja-Jr 1.0, Ninja-Jr dev, etc)'
        required: true
        default: 'Ninja-Jr'
        type: string
      environment:
        description: 'Select environment to build'
        required: true
        default: 'm5stack-cardputer'
        type: choice
        options:
          - "arduino-nesso-n1"
          - "lilygo-t-embed-cc1101"
          - "lilygo-t-embed"
          - "lilygo-t-deck"
          - "lilygo-t-watch-s3"
          - "lilygo-t-deck-pro"
          - "lilygo-t-display-s3"
          - "lilygo-t-display-s3-touch"
          - "lilygo-t-display-s3-mmc"
          - "lilygo-t-display-s3-touch-mmc"
          - "lilygo-t-display-S3-pro"
          - "lilygo-t-display-ttgo"
          - "lilygo-t-hmi"
          - "lilygo-t-lora-pager"
          - "m5stack-cardputer"
          - "m5stack-sticks3"
          - "m5stack-cplus2"
          - "m5stack-cplus1_1"
          - "LAUNCHER_m5stack-cplus1_1"
          - "m5stack-core2"
          - "m5stack-core16mb"
          - "m5stack-core4mb"
          - "m5stack-cores3"
          - "m5stack-dinmeter"
          - "esp32-s3-devkitc-1"
          - "esp32-s3-devkitc-1-psram"
          - "esp32-c5"
          - "esp32-c5-tft"
          - "nm-cyd-c5"
          - "CYD-2432S028"
          - "CYD-2USB"
          - "CYD-2432W328C"
          - "CYD-2432W328C_2"
          - "CYD-2432W328R-or-S024R"
          - "CYD-3248S035R"
          - "CYD-3248S035C"
          - "LAUNCHER_CYD-2432W328R-or-S024R"
          - "LAUNCHER_CYD-2432S028"
          - "LAUNCHER_CYD-2USB"
          - "LAUNCHER_CYD-2432W328C"
          - "LAUNCHER_CYD-3248S035R"
          - "LAUNCHER_CYD-3248S035C"
          - "elecrow-24B"
          - "elecrow-28B"
          - "elecrow-advance-35-s3"
          - "smoochiee-board"
          - "reaper"
          - "Phantom_S024R"
          - "LAUNCHER_Phantom_S024R"
          - "Marauder-Mini"
          - "LAUNCHER_Marauder-Mini"
          - "Awok-Mini"
          - "Marauder-v7"
          - "LAUNCHER_Marauder-v7"
          - "Marauder-V4-V6"
          - "Marauder-v61"
          - "LAUNCHER_Marauder-V4-V6"
          - "LAUNCHER_Marauder-v61"
          - "Awok-Touch"
          - "WaveSentry-R1"
          - "LAUNCHER_WaveSentry-R1"

jobs:
  compile_selected:
    name: Build ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ github.event.inputs.version_name }}
      SELECTED_ENV: ${{ github.event.inputs.environment }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build deps (multilib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install requests esptool intelhex

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: Bruce-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: Bruce-platformio-

      - name: Restore PIO Build Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.pio
          key: Bruce-pio-${{ env.SELECTED_ENV }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            Bruce-pio-${{ env.SELECTED_ENV }}-

      - name: Clean stale PlatformIO symlinks
        run: |
          rm -rf .pio/libdeps
          find .pio -name "*.pio-link" -delete 2>/dev/null || true

      - name: Install PlatformIO Core
        run: |
          pip install platformio
          sed -i "s/-DBRUCE_VERSION=/-DBRUCE_VERSION='\"${{ env.VERSION_NAME }}\"' ; /g" ./platformio.ini
          GIT_HASH=$(git describe --always --dirty)
          sed -i "s|-DGIT_COMMIT_HASH='\"Homebrew\"'|!echo '-DGIT_COMMIT_HASH=\\\\\\\\\"${GIT_HASH}\\\\\\\\\"'|g" ./platformio.ini

      - name: Compile firmware
        run: |
          mkdir -p /tmp/full /tmp/issues
          platformio run -e "${{ env.SELECTED_ENV }}" 2>&1 | tee /tmp/full/${{ env.SELECTED_ENV }}.log
          grep -E '^[^ :]+\.(c|cc|cpp|cxx|h|hpp|ino|S):[0-9]+(:[0-9]+)?: ' /tmp/full/${{ env.SELECTED_ENV }}.log \
            > /tmp/issues/${{ env.SELECTED_ENV }}.log || true

      - name: Upload full build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-log-${{ env.SELECTED_ENV }}
          path: /tmp/full/${{ env.SELECTED_ENV }}.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload issues log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issues-log-${{ env.SELECTED_ENV }}
          path: /tmp/issues/${{ env.SELECTED_ENV }}.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Save PIO Build Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ github.workspace }}/.pio
          key: Bruce-pio-${{ env.SELECTED_ENV }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bruce-${{ env.SELECTED_ENV }}
          path: Bruce-*.*
          retention-days: 30
          if-no-files-found: ignore

      - name: Checkout logs branch
        if: always()
        uses: actions/checkout@v4
        with:
          ref: logs
          fetch-depth: 0
        continue-on-error: true

      - name: Create logs branch if missing
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            git checkout --orphan logs
            git rm -rf . 2>/dev/null || true
            cat > README.md << 'EOF'
          # Build Logs

          Automated build and sync logs from the Bruce firmware (Ninja-Jr's fork) builds.

          ## Structure

          - `logs/<branch>/<timestamp>/full/` — complete `platformio run` output per board
          - `logs/<branch>/<timestamp>/issues/` — filtered errors and warnings only
          - `sync/<timestamp>.log` — per-run transcript of the dev/main sync with upstream

          Each timestamp is a single workflow run. Old entries can be pruned freely; only the latest matters for debugging.

          ## Retention

          - `sync/` logs older than 30 days are pruned automatically on each sync run.
          - `logs/` entries are not pruned automatically and can be cleaned up manually.

          ## Notes

          - Binary artifacts are not stored here — they live in the workflow's Artifacts section.
          - Generated content is overwritten on every run. The only hand-edited file is this README.
          EOF
            git add README.md
            git commit -m "chore: initialize logs branch [skip ci]"
          fi

      - name: Write logs to tree
        if: always()
        run: |
          BRANCH_NAME="${{ github.event.inputs.target_branch }}"
          RUN_TS=$(date -u +%Y-%m-%d_%H%M%S)
          DEST="logs/${BRANCH_NAME}/${RUN_TS}"
          mkdir -p "${DEST}/full" "${DEST}/issues"
          cp /tmp/full/${{ env.SELECTED_ENV }}.log "${DEST}/full/" 2>/dev/null || true
          cp /tmp/issues/${{ env.SELECTED_ENV }}.log "${DEST}/issues/" 2>/dev/null || true
          echo "Writing logs to ${DEST}"

      - name: Commit and push logs
        if: always()
        env:
          PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git add logs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update build logs for ${{ github.event.inputs.target_branch }} [skip ci]"
            git push https://x-access-token:${PAT}@github.com/${{ github.repository }}.git HEAD:logs
          else
            echo "No changes to commit"
          fi

      - name: Delete log artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            full-log-*
            issues-log-*
          failOnError: false

      - name: Display Build Info
        if: always()
        run: |
          echo "=========================================="
          echo "Build result:"
          echo "   Environment: ${{ env.SELECTED_ENV }}"
          echo "   Version: ${{ env.VERSION_NAME }}"
          echo "   Branch: ${{ github.event.inputs.target_branch }}"
          echo "   Git Hash: $(git describe --always --dirty)"
          echo "=========================================="
