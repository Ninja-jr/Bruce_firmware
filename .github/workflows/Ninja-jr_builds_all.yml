name: Ninja-Jr Builds (All boards)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to build from'
        required: true
        default: 'dev'
        type: string
      version_name:
        description: 'Version name (Ninja-Jr 1.0, Ninja-Jr dev, etc)'
        required: true
        default: 'Ninja-Jr'
        type: string
      append_hash:
        description: 'Append short commit hash to version'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - dev
    tags:
      - '*'

jobs:
  compile_sketch:
    name: Build ${{ matrix.board.env }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        board:
          - { env: "arduino-nesso-n1",                family: "ESP32-C6",}
          - { env: "m5stack-cardputer",               family: "ESP32-S3",}
          - { env: "m5stack-sticks3",                 family: "ESP32-S3",}
          - { env: "m5stack-cplus2",                  family: "ESP32",}
          - { env: "m5stack-cplus1_1",                family: "ESP32",}
          - { env: "LAUNCHER_m5stack-cplus1_1",       family: "ESP32",}
          - { env: "m5stack-core2",                   family: "ESP32",}
          - { env: "m5stack-core16mb",                family: "ESP32",}
          - { env: "m5stack-core4mb",                 family: "ESP32",}
          - { env: "m5stack-cores3",                  family: "ESP32-S3",}
          - { env: "m5stack-dinmeter",                family: "ESP32-S3",}
          - { env: "esp32-s3-devkitc-1",              family: "ESP32-S3",}
          - { env: "esp32-s3-devkitc-1-psram",        family: "ESP32-S3",}
          - { env: "esp32-c5",                        family: "ESP32-C5",}
          - { env: "esp32-c5-tft",                    family: "ESP32-C5",}
          - { env: "nm-cyd-c5",                       family: "ESP32-C5",}
          - { env: "CYD-2432S028",                    family: "ESP32",}
          - { env: "CYD-2USB",                        family: "ESP32",}
          - { env: "CYD-2432W328C",                   family: "ESP32",}
          - { env: "CYD-2432W328C_2",                 family: "ESP32",}
          - { env: "CYD-2432W328R-or-S024R",          family: "ESP32",}
          - { env: "CYD-3248S035R",                   family: "ESP32",}
          - { env: "CYD-3248S035C",                   family: "ESP32",}
          - { env: "LAUNCHER_CYD-2432W328R-or-S024R", family: "ESP32",}
          - { env: "LAUNCHER_CYD-2432S028",           family: "ESP32",}
          - { env: "LAUNCHER_CYD-2USB",               family: "ESP32",}
          - { env: "LAUNCHER_CYD-2432W328C",          family: "ESP32",}
          - { env: "LAUNCHER_CYD-3248S035R",          family: "ESP32",}
          - { env: "lilygo-t-embed-cc1101",           family: "ESP32-S3",}
          - { env: "lilygo-t-embed",                  family: "ESP32-S3",}
          - { env: "lilygo-t-deck",                   family: "ESP32-S3",}
          - { env: "lilygo-t-watch-s3",               family: "ESP32-S3",}
          - { env: "lilygo-t-deck-pro",               family: "ESP32-S3",}
          - { env: "lilygo-t-display-s3",             family: "ESP32-S3",}
          - { env: "lilygo-t-display-s3-touch",       family: "ESP32-S3",}
          - { env: "lilygo-t-display-s3-mmc",         family: "ESP32-S3",}
          - { env: "lilygo-t-display-s3-touch-mmc",   family: "ESP32-S3",}
          - { env: "lilygo-t-display-S3-pro",         family: "ESP32-S3",}
          - { env: "lilygo-t-display-ttgo",           family: "ESP32",}
          - { env: "lilygo-t-hmi",                    family: "ESP32-S3",}
          - { env: "lilygo-t-lora-pager",             family: "ESP32-S3",}
          - { env: "elecrow-24B",                     family: "ESP32",}
          - { env: "elecrow-28B",                     family: "ESP32",}
          - { env: "elecrow-advance-35-s3",           family: "ESP32-S3",}
          - { env: "smoochiee-board",                 family: "ESP32-S3",}
          - { env: "reaper",                          family: "ESP32-S3",}
          - { env: "Phantom_S024R",                   family: "ESP32",}
          - { env: "LAUNCHER_Phantom_S024R",          family: "ESP32",}
          - { env: "Marauder-Mini",                   family: "ESP32",}
          - { env: "LAUNCHER_Marauder-Mini",          family: "ESP32",}
          - { env: "Awok-Mini",                       family: "ESP32",}
          - { env: "Marauder-v7",                     family: "ESP32",}
          - { env: "LAUNCHER_Marauder-v7",            family: "ESP32",}
          - { env: "Marauder-V4-V6",                  family: "ESP32",}
          - { env: "Marauder-v61",                    family: "ESP32",}
          - { env: "LAUNCHER_Marauder-V4-V6",         family: "ESP32",}
          - { env: "LAUNCHER_Marauder-v61",           family: "ESP32",}
          - { env: "Awok-Touch",                      family: "ESP32",}
          - { env: "WaveSentry-R1",                   family: "ESP32",}
          - { env: "LAUNCHER_WaveSentry-R1",          family: "ESP32",}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_branch || github.ref }}
          submodules: true

      - name: Resolve version string
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE_NAME="${{ github.event.inputs.version_name }}"
            APPEND_HASH="${{ github.event.inputs.append_hash }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            BASE_NAME="${{ github.ref_name }}"
            APPEND_HASH="false"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BASE_NAME="Ninja-Jr"
            APPEND_HASH="true"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            BASE_NAME="Ninja-Jr dev"
            APPEND_HASH="true"
          else
            BASE_NAME="Ninja-Jr"
            APPEND_HASH="true"
          fi

          GIT_HASH=$(git rev-parse --short HEAD)
          if [ "$APPEND_HASH" = "true" ]; then
            VERSION="${BASE_NAME} (${GIT_HASH})"
          else
            VERSION="${BASE_NAME}"
          fi
          echo "resolved=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Final version: ${VERSION}"

      - name: Install build deps (multilib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install requests esptool intelhex

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: Bruce-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: Bruce-platformio-

      - name: Restore PIO Build Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.pio
          key: Bruce-pio-${{ matrix.board.env }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            Bruce-pio-${{ matrix.board.env }}-

      - name: Clean stale PlatformIO symlinks
        run: |
          rm -rf .pio/libdeps
          find .pio -name "*.pio-link" -delete 2>/dev/null || true

      - name: Install PlatformIO and configure version
        run: |
          pip install platformio
          sed -i "s/-DBRUCE_VERSION=/-DBRUCE_VERSION='\"${{ steps.version.outputs.resolved }}\"' ; /g" ./platformio.ini
          GIT_HASH=$(git rev-parse --short HEAD)
          sed -i "s|-DGIT_COMMIT_HASH='\"Homebrew\"'|!echo '-DGIT_COMMIT_HASH=\\\\\\\\\"${GIT_HASH}\\\\\\\\\"'|g" ./platformio.ini

      - name: Compile firmware
        run: |
          mkdir -p /tmp/full /tmp/issues
          platformio run -e ${{ matrix.board.env }} 2>&1 | tee /tmp/full/${{ matrix.board.env }}.log
          grep -E '^[^ :]+\.(c|cc|cpp|cxx|h|hpp|ino|S):[0-9]+(:[0-9]+)?: ' /tmp/full/${{ matrix.board.env }}.log \
            > /tmp/issues/${{ matrix.board.env }}.log || true

      - name: Upload full build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-log-${{ matrix.board.env }}
          path: /tmp/full/${{ matrix.board.env }}.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload issues log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issues-log-${{ matrix.board.env }}
          path: /tmp/issues/${{ matrix.board.env }}.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Save PIO Build Cache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.pio
          key: Bruce-pio-${{ matrix.board.env }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bruce-${{ matrix.board.env }}-${{ steps.version.outputs.resolved }}
          path: Bruce-*.*
          retention-days: 5
          if-no-files-found: ignore

  collect_logs:
    name: Collect Build Logs
    runs-on: ubuntu-latest
    needs: compile_sketch
    if: always()
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Download full logs
        uses: actions/download-artifact@v4
        with:
          pattern: 'full-log-*'
          path: /tmp/logs/full
          merge-multiple: true

      - name: Download issues logs
        uses: actions/download-artifact@v4
        with:
          pattern: 'issues-log-*'
          path: /tmp/logs/issues
          merge-multiple: true

      - name: Checkout logs branch
        uses: actions/checkout@v4
        with:
          ref: logs
          fetch-depth: 0
        continue-on-error: true

      - name: Create logs branch if missing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            git checkout --orphan logs
            git rm -rf . 2>/dev/null || true
            cat > README.md << 'EOF'
          # Build Logs

          Automated build and sync logs from the Bruce firmware (Ninja-Jr's fork) builds.

          ## Structure

          - `logs/<branch>/<timestamp>/full/` — complete `platformio run` output per board
          - `logs/<branch>/<timestamp>/issues/` — filtered errors and warnings only
          - `sync/<timestamp>.log` — per-run transcript of the dev/main sync with upstream

          Each timestamp is a single workflow run. Old entries can be pruned freely; only the latest matters for debugging.

          ## Retention

          - `sync/` logs older than 30 days are pruned automatically on each sync run.
          - `logs/` entries are not pruned automatically and can be cleaned up manually.

          ## Notes

          - Binary artifacts are not stored here — they live in the workflow's Artifacts section.
          - Generated content is overwritten on every run. The only hand-edited file is this README.
          EOF
            git add README.md
            git commit -m "chore: initialize logs branch [skip ci]"
          fi

      - name: Write logs to tree
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH_NAME="${{ github.event.inputs.target_branch }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          RUN_TS=$(date -u +%Y-%m-%d_%H%M%S)
          DEST="logs/${BRANCH_NAME}/${RUN_TS}"
          mkdir -p "${DEST}/full" "${DEST}/issues"
          cp /tmp/logs/full/*.log "${DEST}/full/" 2>/dev/null || true
          cp /tmp/logs/issues/*.log "${DEST}/issues/" 2>/dev/null || true
          echo "Writing logs to ${DEST}"

      - name: Commit and push logs
        env:
          PAT: ${{ secrets.SYNC_PAT }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH_NAME="${{ github.event.inputs.target_branch }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          git add logs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update build logs for ${BRANCH_NAME} [skip ci]"
            git push https://x-access-token:${PAT}@github.com/${{ github.repository }}.git HEAD:logs
          else
            echo "No changes to commit"
          fi

      - name: Delete log artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            full-log-*
            issues-log-*
          failOnError: false

  post_compile_steps:
    name: Update Releases
    runs-on: ubuntu-latest
    environment: github_release
    needs: compile_sketch
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'Bruce-*'
          merge-multiple: true
          path: artifacts

      - name: Ensure releases exist and get IDs
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            let betaId;
            try {
              const betaResp = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'betaRelease'
              });
              betaId = betaResp.data.id;
            } catch (error) {
              if (error.status === 404) {
                const newBeta = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: 'betaRelease',
                  name: 'betaRelease - Ninja-Jr builds',
                  prerelease: true
                });
                betaId = newBeta.data.id;
              } else {
                throw error;
              }
            }
            let lastId;
            try {
              const lastResp = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'lastRelease'
              });
              lastId = lastResp.data.id;
            } catch (error) {
              if (error.status === 404) {
                const newLast = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: 'lastRelease',
                  name: 'lastRelease - Ninja-Jr builds',
                  prerelease: true
                });
                lastId = newLast.data.id;
              } else {
                throw error;
              }
            }
            core.setOutput('beta', betaId.toString());
            core.setOutput('last', lastId.toString())

      - name: Delete old betaRelease assets
        uses: actions/github-script@v6
        with:
          script: |
            const release_id = ${{ steps.get_release.outputs.beta }};
            const assets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release_id
            });
            for (const asset of assets.data) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id
              });
            }

      - name: Upload new betaRelease assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.SYNC_PAT }}
          name: betaRelease - Ninja-Jr builds
          tag_name: betaRelease
          prerelease: true
          files: artifacts/Bruce-*.bin
          fail_on_unmatched_files: false
          make_latest: false
          generate_release_notes: false

      - name: Delete old lastRelease assets
        uses: actions/github-script@v6
        if: github.ref_type == 'tag'
        with:
          script: |
            const release_id = ${{ steps.get_release.outputs.last }};
            const assets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release_id
            });
            for (const asset of assets.data) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id
              });
            }

      - name: Upload new lastRelease assets
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          token: ${{ secrets.SYNC_PAT }}
          name: lastRelease - Ninja-Jr builds
          tag_name: lastRelease
          prerelease: true
          files: artifacts/Bruce-*.bin
          fail_on_unmatched_files: false
          make_latest: false
          generate_release_notes: false

  create_release:
    runs-on: ubuntu-latest
    environment: github_release
    needs: [compile_sketch]
    if: always() && github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'Bruce-*'
          merge-multiple: true
          path: artifacts

      - name: Create Release Ninja-Jr
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.SYNC_PAT }}
          name: Bruce Release Ninja-Jr
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
