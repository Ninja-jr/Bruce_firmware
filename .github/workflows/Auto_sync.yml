name: Auto Sync Bruce Branches

on:
  schedule:
    - cron: '0 3 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0
          submodules: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/PR3Y/Bruce.git 2>/dev/null || git remote set-url upstream https://github.com/PR3Y/Bruce.git
          git fetch upstream --tags --prune

      - name: Sync tags from upstream
        run: |
          git fetch upstream --tags --force
          git push origin --tags --force

      - name: Sync dev and main branches
        run: |
          REPORT="/tmp/sync_report.txt"
          : > "$REPORT"

          sync_branch() {
            local BRANCH_NAME="$1"
            echo "=== $BRANCH_NAME ===" >> "$REPORT"

            git fetch origin "$BRANCH_NAME"
            git checkout "$BRANCH_NAME" 2>/dev/null || git checkout -b "$BRANCH_NAME" --track origin/"$BRANCH_NAME"
            git fetch upstream "$BRANCH_NAME"

            local BEFORE_SHA
            BEFORE_SHA=$(git rev-parse HEAD)
            echo "Before: $BEFORE_SHA" >> "$REPORT"

            if git diff --quiet "$BRANCH_NAME" upstream/"$BRANCH_NAME" -- . ':!.github/workflows/'; then
              echo "Action: no changes (already in sync)" >> "$REPORT"
              echo "After:  $BEFORE_SHA" >> "$REPORT"
              echo "" >> "$REPORT"
              return 0
            fi

            local AHEAD
            AHEAD=$(git rev-list --count "$BRANCH_NAME"..upstream/"$BRANCH_NAME" 2>/dev/null || echo "0")
            echo "Upstream ahead by: $AHEAD commit(s)" >> "$REPORT"

            local PRE_MERGE_SHA
            PRE_MERGE_SHA=$(git rev-parse HEAD)
            local WORKFLOWS_BACKUP
            WORKFLOWS_BACKUP=$(mktemp -d)
            if [ -d .github/workflows ]; then
              cp -a .github/workflows/. "$WORKFLOWS_BACKUP/"
            fi

            if ! git merge --no-edit --no-ff -X theirs upstream/"$BRANCH_NAME" -m "chore: sync with upstream $(date +'%Y-%m-%d') [skip ci]"; then
              echo "Action: MERGE FAILED, aborted" >> "$REPORT"
              echo "After:  $BEFORE_SHA (unchanged)" >> "$REPORT"
              echo "" >> "$REPORT"
              git merge --abort 2>/dev/null || true
              git reset --hard origin/"$BRANCH_NAME" 2>/dev/null || true
              rm -rf "$WORKFLOWS_BACKUP"
              return 1
            fi

            local POST_MERGE_SHA
            POST_MERGE_SHA=$(git rev-parse HEAD)

            if [ "$PRE_MERGE_SHA" = "$POST_MERGE_SHA" ]; then
              echo "Action: already up to date (merge was a no-op)" >> "$REPORT"
              echo "After:  $POST_MERGE_SHA" >> "$REPORT"
              echo "" >> "$REPORT"
              rm -rf "$WORKFLOWS_BACKUP"
              return 0
            fi

            echo "Action: merged" >> "$REPORT"
            echo "After:  $POST_MERGE_SHA" >> "$REPORT"

            if [ "$BRANCH_NAME" = "dev" ]; then
              for PATH_TO_KEEP in "src/modules/rf/rf_jammer.cpp" "src/modules/NRF24/nrf_jammer.cpp"; do
                if git checkout "$BRANCH_NAME" -- "$PATH_TO_KEEP" 2>/dev/null; then
                  echo "Preserved: $PATH_TO_KEEP" >> "$REPORT"
                fi
              done
            fi

            rm -rf .github/workflows
            mkdir -p .github/workflows
            if [ -n "$(ls -A "$WORKFLOWS_BACKUP" 2>/dev/null)" ]; then
              cp -a "$WORKFLOWS_BACKUP"/. .github/workflows/
            fi
            git add .github/workflows/
            git commit --amend --no-edit 2>/dev/null || true

            if ! git diff --quiet "$PRE_MERGE_SHA" HEAD -- .github/workflows/; then
              echo "Workflows verify: FAILED, forcing from pre-merge SHA" >> "$REPORT"
              git checkout "$PRE_MERGE_SHA" -- .github/workflows/
              git add .github/workflows/
              git commit --amend --no-edit 2>/dev/null || true
              if ! git diff --quiet "$PRE_MERGE_SHA" HEAD -- .github/workflows/; then
                echo "Workflows verify: FAILED AGAIN, aborting" >> "$REPORT"
                echo "After:  $BEFORE_SHA (reset)" >> "$REPORT"
                echo "" >> "$REPORT"
                git reset --hard origin/"$BRANCH_NAME"
                rm -rf "$WORKFLOWS_BACKUP"
                return 1
              fi
              echo "Workflows verify: OK after fallback" >> "$REPORT"
            else
              echo "Workflows verify: OK" >> "$REPORT"
            fi
            echo "Preserved: .github/workflows/" >> "$REPORT"

            rm -rf "$WORKFLOWS_BACKUP"

            if ! git diff --quiet origin/"$BRANCH_NAME" "$BRANCH_NAME"; then
              local FINAL_SHA
              FINAL_SHA=$(git rev-parse HEAD)
              if git push origin "$BRANCH_NAME" --force-with-lease; then
                echo "Push: success ($FINAL_SHA)" >> "$REPORT"
              else
                echo "Push: FAILED" >> "$REPORT"
              fi
            else
              echo "Push: skipped (no changes)" >> "$REPORT"
            fi
            echo "" >> "$REPORT"
          }

          sync_branch "dev" || true
          sync_branch "main" || true

      - name: Create releases for new tags
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          if ! command -v gh &> /dev/null; then
            type -p curl >/dev/null || sudo apt install curl -y
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
          fi
          
          git fetch upstream --tags
          UPSTREAM_TAGS=$(git ls-remote --tags upstream | grep -v '{}' | cut -f2 | sed 's|refs/tags/||')
          OUR_TAGS=$(git ls-remote --tags origin | grep -v '{}' | cut -f2 | sed 's|refs/tags/||')
          NEW_TAGS=$(comm -13 <(echo "$OUR_TAGS" | sort) <(echo "$UPSTREAM_TAGS" | sort))
          
          for TAG in $NEW_TAGS; do
            echo "Creating release for new tag: $TAG"
            git fetch upstream $TAG
            TAG_MESSAGE=$(git tag -l --format='%(contents)' $TAG 2>/dev/null || echo "Release $TAG")
            gh release create $TAG --title "$TAG" --notes "$TAG_MESSAGE" --target main || echo "Failed to create release for $TAG"
          done

      - name: Write sync log to logs branch
        if: always()
        env:
          PAT: ${{ secrets.SYNC_PAT }}
        run: |
          RUN_TS=$(date -u +%Y-%m-%d_%H%M%S)
          DEST="sync/${RUN_TS}.log"
          REMOTE="https://x-access-token:${PAT}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch "$REMOTE" logs 2>/dev/null; then
            git checkout -B logs FETCH_HEAD
          else
            echo "logs branch missing—creating orphan branch"
            git checkout --orphan logs
            git rm -rf . 2>/dev/null || true
            cat > README.md << 'EOF'
          # Build Logs

          Automated build and sync logs from the Bruce firmware (Ninja-Jr's fork) builds.

          ## Structure

          - `logs/<branch>/<timestamp>/full/` — complete `platformio run` output per board
          - `logs/<branch>/<timestamp>/issues/` — filtered errors and warnings only
          - `sync/<timestamp>.log` — per-run transcript of the dev/main sync with upstream

          Each timestamp is a single workflow run. Old entries can be pruned freely; only the latest matters for debugging.

          ## Retention

          - `sync/` logs older than 30 days are pruned automatically on each sync run.
          - `logs/` entries are not pruned automatically and can be cleaned up manually.

          ## Notes

          - Binary artifacts are not stored here — they live in the workflow's Artifacts section.
          - Generated content is overwritten on every run. The only hand-edited file is this README.
          EOF
            git add README.md
            git commit -m "chore: initialize logs branch [skip ci]"
          fi

          if [ ! -f README.md ]; then
            cat > README.md << 'EOF'
          # Build Logs

          Automated build and sync logs from the Bruce firmware (Ninja-Jr's fork) builds.

          ## Structure

          - `logs/<branch>/<timestamp>/full/` — complete `platformio run` output per board
          - `logs/<branch>/<timestamp>/issues/` — filtered errors and warnings only
          - `sync/<timestamp>.log` — per-run transcript of the dev/main sync with upstream

          Each timestamp is a single workflow run. Old entries can be pruned freely; only the latest matters for debugging.

          ## Retention

          - `sync/` logs older than 30 days are pruned automatically on each sync run.
          - `logs/` entries are not pruned automatically and can be cleaned up manually.

          ## Notes

          - Binary artifacts are not stored here — they live in the workflow's Artifacts section.
          - Generated content is overwritten on every run. The only hand-edited file is this README.
          EOF
            git add README.md
          fi

          CUTOFF=$(date -u -d '30 days ago' +%Y-%m-%d)
          if [ -d sync ]; then
            for f in sync/*.log; do
              [ -e "$f" ] || continue
              fname=$(basename "$f")
              fdate=${fname%%_*}
              if [[ "$fdate" < "$CUTOFF" ]]; then
                echo "Pruning $f (older than $CUTOFF)"
                git rm -q "$f"
              fi
            done
          fi

          mkdir -p sync
          {
            echo "# Sync run ${RUN_TS}"
            echo "Trigger: ${{ github.event_name }}"
            echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## Tags"
            echo "Upstream tags: $(git ls-remote --tags upstream | grep -v '{}' | wc -l)"
            echo "Local tags:    $(git ls-remote --tags origin | grep -v '{}' | wc -l)"
            echo ""
            echo "## Branch sync report"
            if [ -f /tmp/sync_report.txt ]; then
              cat /tmp/sync_report.txt
            else
              echo "(no report captured)"
            fi
          } > "$DEST"
          git add sync/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: sync log ${RUN_TS} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push "$REMOTE" HEAD:logs; then
              echo "Pushed sync log"
              exit 0
            fi
            git pull --rebase "$REMOTE" logs || true
            sleep $((RANDOM % 3 + 1))
          done
          echo "Failed to push sync log after 5 attempts"
