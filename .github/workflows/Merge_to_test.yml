name: Merge PRs and Build

on:
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: 'PR numbers to merge (comma separated, e.g., "123,456,789")'
        required: false
        default: ''
      commit_hashes:
        description: 'Commit hashes to cherry-pick (comma separated, e.g., "abc123,def456")'
        required: false
        default: ''
      version_name:
        description: 'Version name (Ninja-Jr 1.0, Ninja-Jr dev, etc)'
        required: true
        default: 'Ninja-Jr PR Test'
        type: string
      test_branch:
        description: 'Target test branch name'
        required: true
        default: 'test'
      base_branch:
        description: 'Base branch to start from (use "upstream/dev" for upstream)'
        required: true
        default: 'upstream/dev'
      build_env:
        description: 'Select environment to build'
        required: true
        default: 'm5stack-cardputer'
        type: choice
        options:
          - "arduino-nesso-n1"
          - "m5stack-cardputer"
          - "m5stack-sticks3"
          - "m5stack-cplus2"
          - "m5stack-cplus1_1"
          - "LAUNCHER_m5stack-cplus1_1"
          - "m5stack-core2"
          - "m5stack-core16mb"
          - "m5stack-core4mb"
          - "m5stack-cores3"
          - "m5stack-dinmeter"
          - "esp32-s3-devkitc-1"
          - "esp32-s3-devkitc-1-psram"
          - "esp32-c5"
          - "esp32-c5-tft"
          - "nm-cyd-c5"
          - "CYD-2432S028"
          - "CYD-2USB"
          - "CYD-2432W328C"
          - "CYD-2432W328C_2"
          - "CYD-2432W328R-or-S024R"
          - "CYD-3248S035R"
          - "CYD-3248S035C"
          - "LAUNCHER_CYD-2432W328R-or-S024R"
          - "LAUNCHER_CYD-2432S028"
          - "LAUNCHER_CYD-2USB"
          - "LAUNCHER_CYD-2432W328C"
          - "LAUNCHER_CYD-3248S035R"
          - "LAUNCHER_CYD-3248S035C"
          - "lilygo-t-embed-cc1101"
          - "lilygo-t-embed"
          - "lilygo-t-deck"
          - "lilygo-t-watch-s3"
          - "lilygo-t-deck-pro"
          - "lilygo-t-display-s3"
          - "lilygo-t-display-s3-touch"
          - "lilygo-t-display-s3-mmc"
          - "lilygo-t-display-s3-touch-mmc"
          - "lilygo-t-display-S3-pro"
          - "lilygo-t-display-ttgo"
          - "lilygo-t-hmi"
          - "lilygo-t-lora-pager"
          - "elecrow-24B"
          - "elecrow-28B"
          - "elecrow-advance-35-s3"
          - "smoochiee-board"
          - "reaper"
          - "Phantom_S024R"
          - "LAUNCHER_Phantom_S024R"
          - "Marauder-Mini"
          - "LAUNCHER_Marauder-Mini"
          - "Awok-Mini"
          - "Marauder-v7"
          - "LAUNCHER_Marauder-v7"
          - "Marauder-V4-V6"
          - "Marauder-v61"
          - "LAUNCHER_Marauder-V4-V6"
          - "LAUNCHER_Marauder-v61"
          - "Awok-Touch"
          - "WaveSentry-R1"
          - "LAUNCHER_WaveSentry-R1"

permissions:
  contents: write

jobs:
  merge-prs-to-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      new_merged_items: ${{ steps.merge_prs.outputs.new_merged_items }}
      success_count: ${{ steps.merge_prs.outputs.success_count }}
      failed_count: ${{ steps.merge_prs.outputs.failed_count }}
    steps:
      - name: Checkout our fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/PR3Y/Bruce.git 2>/dev/null || git remote set-url upstream https://github.com/PR3Y/Bruce.git
          git fetch upstream --tags --prune
          
      - name: Setup test branch
        run: |
          BASE="${{ github.event.inputs.base_branch }}"
          TEST_BRANCH="${{ github.event.inputs.test_branch }}"
          
          if git show-ref --verify --quiet refs/heads/$TEST_BRANCH; then
            echo "✅ Test branch '$TEST_BRANCH' already exists. Checking it out..."
            git checkout $TEST_BRANCH
            echo "ℹ️  Keeping existing items in the branch."
          else
            echo "🆕 Creating new test branch '$TEST_BRANCH' from base..."
            if [[ "$BASE" == upstream/* ]]; then
              BRANCH=${BASE#upstream/}
              git fetch upstream $BRANCH
              git checkout -b $TEST_BRANCH upstream/$BRANCH
            else
              git checkout -b $TEST_BRANCH origin/$BASE
            fi
          fi
          
      - name: Ensure tracking file exists
        run: |
          if [ ! -f merged_items.txt ]; then
            cat > merged_items.txt << 'EOF'
          # PRs and commits merged into ${{ github.event.inputs.test_branch }}
          # Format: PRs are numbers, commits are 7+ char hex strings
          # Example:
          #   123  (PR #123)
          #   abc123  (commit)
          # Last updated: $(date)
          --------------------------
          
          # ── PRs ──
          
          # ── Commits ──
          EOF
            git add merged_items.txt
            git commit -m "chore: initialize merged items tracking [skip ci]"
          fi
          
      - name: Read existing merged items
        id: read_merged
        run: |
          if [ -f merged_items.txt ]; then
            # Extract PR numbers (lines that are just numbers)
            PRS=$(grep -E '^[0-9]+$' merged_items.txt | tr '\n' ',' | sed 's/,$//')
            # Extract commit hashes (lines that are 7+ hex chars)
            COMMITS=$(grep -E '^[a-f0-9]{7,}$' merged_items.txt | tr '\n' ',' | sed 's/,$//')
            echo "existing_prs=$PRS" >> $GITHUB_OUTPUT
            echo "existing_commits=$COMMITS" >> $GITHUB_OUTPUT
          else
            echo "existing_prs=" >> $GITHUB_OUTPUT
            echo "existing_commits=" >> $GITHUB_OUTPUT
          fi
          
      - name: Merge PRs and cherry-pick commits
        id: merge_prs
        env:
          PR_NUMBERS: ${{ github.event.inputs.pr_numbers }}
          COMMIT_HASHES: ${{ github.event.inputs.commit_hashes }}
          EXISTING_PRS: ${{ steps.read_merged.outputs.existing_prs }}
          EXISTING_COMMITS: ${{ steps.read_merged.outputs.existing_commits }}
        run: |
          SUCCESS_COUNT=0
          FAIL_COUNT=0
          ALREADY_MERGED=0
          NEW_ITEMS=""
          PRS_TO_ADD=""
          COMMITS_TO_ADD=""
          
          # ──────────────────────────────────────────
          # MERGE PRs
          # ──────────────────────────────────────────
          IFS=',' read -ra PR_ARRAY <<< "$PR_NUMBERS"
          for PR in "${PR_ARRAY[@]}"; do
            PR=$(echo "$PR" | xargs)
            if [ -z "$PR" ]; then continue; fi
            
            # Check if PR already merged
            if echo "$EXISTING_PRS" | grep -q "\b$PR\b"; then
              echo "ℹ️  PR #$PR already merged - skipping"
              ALREADY_MERGED=$((ALREADY_MERGED + 1))
              continue
            fi
            
            echo "=========================================="
            echo "Processing PR #$PR"
            echo "=========================================="
            
            git fetch upstream pull/$PR/head:pr-$PR
            
            if git merge --no-edit --no-ff pr-$PR -m "chore: merge PR #$PR [skip ci]"; then
              echo "✅ Successfully merged PR #$PR"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              NEW_ITEMS="$NEW_ITEMS PR#$PR"
              PRS_TO_ADD="$PRS_TO_ADD $PR"
            else
              git merge --abort
              echo "❌ Conflict in PR #$PR - Skipping..."
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done
          
          # ──────────────────────────────────────────
          # CHERRY-PICK COMMITS
          # ──────────────────────────────────────────
          IFS=',' read -ra COMMIT_ARRAY <<< "$COMMIT_HASHES"
          for COMMIT in "${COMMIT_ARRAY[@]}"; do
            COMMIT=$(echo "$COMMIT" | xargs)
            if [ -z "$COMMIT" ]; then continue; fi
            
            # Check if commit already cherry-picked
            if echo "$EXISTING_COMMITS" | grep -q "\b$COMMIT\b"; then
              echo "ℹ️  Commit $COMMIT already cherry-picked - skipping"
              ALREADY_MERGED=$((ALREADY_MERGED + 1))
              continue
            fi
            
            echo "=========================================="
            echo "Cherry-picking commit: $COMMIT"
            echo "=========================================="
            
            git fetch upstream
            
            if git cherry-pick $COMMIT; then
              echo "✅ Successfully cherry-picked $COMMIT"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              NEW_ITEMS="$NEW_ITEMS commit#$COMMIT"
              COMMITS_TO_ADD="$COMMITS_TO_ADD $COMMIT"
            else
              git cherry-pick --abort
              echo "❌ Conflict in commit $COMMIT - Skipping..."
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done
          
          # ──────────────────────────────────────────
          # UPDATE TRACKING FILE
          # ──────────────────────────────────────────
          if [ ! -z "$PRS_TO_ADD" ] || [ ! -z "$COMMITS_TO_ADD" ]; then
            echo "📝 Updating tracking file..."
            
            # Rebuild the file from scratch (clean format)
            rm -f merged_items.txt
            
            cat > merged_items.txt << 'EOF'
          # PRs and commits merged into ${{ github.event.inputs.test_branch }}
          # Format: PRs are numbers, commits are 7+ char hex strings
          # Example:
          #   123  (PR #123)
          #   abc123  (commit)
          # Last updated: $(date)
          --------------------------
          
          # ── PRs ──
          EOF
            
            # Add all PRs (existing + new)
            if [ ! -z "$EXISTING_PRS" ]; then
              echo "$EXISTING_PRS" | tr ',' '\n' >> merged_items.txt
            fi
            for PR in $PRS_TO_ADD; do
              echo "$PR" >> merged_items.txt
            done
            
            echo "" >> merged_items.txt
            echo "# ── Commits ──" >> merged_items.txt
            
            # Add all commits (existing + new)
            if [ ! -z "$EXISTING_COMMITS" ]; then
              echo "$EXISTING_COMMITS" | tr ',' '\n' >> merged_items.txt
            fi
            for COMMIT in $COMMITS_TO_ADD; do
              echo "$COMMIT" >> merged_items.txt
            done
            
            git add merged_items.txt
            git commit -m "chore: update merged items tracking [skip ci]"
          fi
          
          # ──────────────────────────────────────────
          # SUMMARY
          # ──────────────────────────────────────────
          echo "=========================================="
          echo "📊 Merge Summary:"
          echo "   ✅ Successfully merged: $SUCCESS_COUNT item(s)"
          echo "   ❌ Failed/Skipped: $FAIL_COUNT item(s)"
          echo "   ⏩ Already merged: $ALREADY_MERGED item(s)"
          if [ ! -z "$NEW_ITEMS" ]; then
            echo "   📝 New items: $NEW_ITEMS"
          fi
          echo "=========================================="
          
          echo "new_merged_items=$NEW_ITEMS" >> $GITHUB_OUTPUT
          echo "success_count=$SUCCESS_COUNT" >> $GITHUB_OUTPUT
          echo "failed_count=$FAIL_COUNT" >> $GITHUB_OUTPUT
          
      - name: Push test branch to our fork
        run: |
          git push origin ${{ github.event.inputs.test_branch }} --force-with-lease
          
      - name: Display status
        run: |
          echo "=========================================="
          echo "✅ Test branch updated successfully!"
          echo "   Branch: ${{ github.event.inputs.test_branch }}"
          echo "   Base: ${{ github.event.inputs.base_branch }}"
          echo "   Latest commit: $(git log -1 --pretty=format:'%h - %s')"
          echo "=========================================="
          echo ""
          echo "📋 Items currently merged into test branch:"
          cat merged_items.txt 2>/dev/null || echo "   (No tracking file found)"

  build:
    name: Build ${{ github.event.inputs.build_env }}
    runs-on: ubuntu-latest
    needs: merge-prs-to-test
    if: needs.merge-prs-to-test.outputs.success_count > 0
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SELECTED_ENV: ${{ github.event.inputs.build_env }}
      VERSION_NAME: ${{ github.event.inputs.version_name }}
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}
          ref: ${{ github.event.inputs.test_branch }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build deps (multilib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386
          
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          pip install requests esptool intelhex
          
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: Bruce-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: Bruce-platformio-

      - name: Restore PIO Build Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.pio
          key: Bruce-pio-${{ env.SELECTED_ENV }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            Bruce-pio-${{ env.SELECTED_ENV }}-
            
      - name: Install PlatformIO Core
        run: |
          pip install platformio
          sed -i "s/-DBRUCE_VERSION=/-DBRUCE_VERSION='\"${{ env.VERSION_NAME }}\"' ; /g" ./platformio.ini
          GIT_HASH=$(git describe --always --dirty)
          sed -i "s|-DGIT_COMMIT_HASH='\"Homebrew\"'|!echo '-DGIT_COMMIT_HASH=\\\\\\\\\"${GIT_HASH}\\\\\\\\\"'|g" ./platformio.ini
          
      - name: Run Compile for selected environment
        run: |
          echo "Building environment: ${{ env.SELECTED_ENV }}"
          platformio run -e "${{ env.SELECTED_ENV }}"
          
      - name: Save PIO Build Cache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.pio
          key: Bruce-pio-${{ env.SELECTED_ENV }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-${{ env.SELECTED_ENV }}-${{ env.VERSION_NAME }}
          path: Bruce-*.*
          retention-days: 30
          if-no-files-found: error

      - name: Display Build Info
        run: |
          echo "=========================================="
          echo "✅ Build completed successfully!"
          echo "   Environment: ${{ env.SELECTED_ENV }}"
          echo "   Version: ${{ env.VERSION_NAME }}"
          echo "   Branch: ${{ github.event.inputs.test_branch }}"
          echo "   Git Hash: $(git describe --always)"
          echo "=========================================="
          ls -la Bruce-*.* 2>/dev/null || echo "No Bruce files found"
          
  skip-build:
    name: Skip Build (No Items Merged)
    runs-on: ubuntu-latest
    needs: merge-prs-to-test
    if: needs.merge-prs-to-test.outputs.success_count == 0
    steps:
      - name: Display skip message
        run: |
          echo "=========================================="
          echo "ℹ️  No new items were merged."
          echo "ℹ️  Skipping build step."
          echo "=========================================="
