name: Ninja-Jr Build (M5Stack Cardputer)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to build from'
        required: true
        default: 'dev'
        type: string
      version_name:
        description: 'Version name (Ninja-Jr 1.0, Ninja-Jr dev, etc)'
        required: true
        default: 'Ninja-Jr'
        type: string
      append_hash:
        description: 'Append short commit hash to version'
        required: false
        default: true
        type: boolean

jobs:
  compile_sketch:
    name: Build m5stack-cardputer
    runs-on: ubuntu-latest
    env:
      BOARD_ENV: "m5stack-cardputer"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          submodules: true

      - name: Resolve version string
        id: version
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          if [ "${{ github.event.inputs.append_hash }}" = "true" ]; then
            VERSION="${{ github.event.inputs.version_name }} (${GIT_HASH})"
          else
            VERSION="${{ github.event.inputs.version_name }}"
          fi
          echo "resolved=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Final version: ${VERSION}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build deps (multilib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install requests esptool intelhex

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: Bruce-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: Bruce-platformio-

      - name: Restore PIO Build Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.pio
          key: Bruce-pio-${{ env.BOARD_ENV }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            Bruce-pio-${{ env.BOARD_ENV }}-

      - name: Clean stale PlatformIO symlinks
        run: |
          rm -rf .pio/libdeps
          find .pio -name "*.pio-link" -delete 2>/dev/null || true

      - name: Install PlatformIO and configure version
        run: |
          pip install platformio
          sed -i "s/-DBRUCE_VERSION=/-DBRUCE_VERSION='\"${{ steps.version.outputs.resolved }}\"' ; /g" ./platformio.ini
          GIT_HASH=$(git rev-parse --short HEAD)
          sed -i "s|-DGIT_COMMIT_HASH='\"Homebrew\"'|!echo '-DGIT_COMMIT_HASH=\\\\\\\\\"${GIT_HASH}\\\\\\\\\"'|g" ./platformio.ini

      - name: Compile firmware
        run: |
          mkdir -p /tmp/full /tmp/issues
          platformio run -e ${{ env.BOARD_ENV }} 2>&1 | tee /tmp/full/${{ env.BOARD_ENV }}.log
          grep -E '^[^ :]+\.(c|cc|cpp|cxx|h|hpp|ino|S):[0-9]+(:[0-9]+)?: ' /tmp/full/${{ env.BOARD_ENV }}.log \
            > /tmp/issues/${{ env.BOARD_ENV }}.log || true

      - name: Upload full build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-log-${{ env.BOARD_ENV }}
          path: /tmp/full/${{ env.BOARD_ENV }}.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload issues log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issues-log-${{ env.BOARD_ENV }}
          path: /tmp/issues/${{ env.BOARD_ENV }}.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Save PIO Build Cache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.pio
          key: Bruce-pio-${{ env.BOARD_ENV }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-${{ env.BOARD_ENV }}-${{ steps.version.outputs.resolved }}
          path: |
            Bruce-*.bin
            Bruce-*.elf
            Bruce-*.map
          retention-days: 30
          if-no-files-found: error

      - name: Display Build Info
        run: |
          echo "Build completed successfully!"
          echo "Environment: ${{ env.BOARD_ENV }}"
          echo "Version: ${{ steps.version.outputs.resolved }}"
          echo "Git Hash: $(git rev-parse --short HEAD)"
          ls -la Bruce-*.* 2>/dev/null || echo "No Bruce files found"

      - name: Checkout logs branch
        uses: actions/checkout@v4
        with:
          ref: logs
          fetch-depth: 0
        continue-on-error: true

      - name: Create logs branch if missing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            git checkout --orphan logs
            git rm -rf . 2>/dev/null || true
            cat > README.md << 'EOF'
          # Build Logs

          Automated build logs from the Bruce firmware (Ninja-Jr's fork) builds.

          ## Structure

          - `logs/<branch>/<timestamp>/full/` — complete `platformio run` output per board
          - `logs/<branch>/<timestamp>/issues/` — filtered errors and warnings only

          Each timestamp folder is a single workflow run. Old folders can be pruned freely; only the latest matters for debugging.

          ## Notes

          - Binary artifacts are not stored here — they live in the workflow's Artifacts section.
          - Do not edit or commit to this branch manually. It is regenerated on every build.
          EOF
            git add README.md
            git commit -m "chore: initialize logs branch [skip ci]"
          fi

      - name: Write logs to tree
        run: |
          BRANCH_NAME="${{ github.event.inputs.target_branch }}"
          RUN_TS=$(date -u +%Y-%m-%d_%H%M%S)
          DEST="logs/${BRANCH_NAME}/${RUN_TS}"
          mkdir -p "${DEST}/full" "${DEST}/issues"
          cp /tmp/full/${{ env.BOARD_ENV }}.log "${DEST}/full/" 2>/dev/null || true
          cp /tmp/issues/${{ env.BOARD_ENV }}.log "${DEST}/issues/" 2>/dev/null || true
          echo "Writing logs to ${DEST}"

      - name: Commit and push logs
        env:
          PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git add logs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update build logs for ${{ github.event.inputs.target_branch }} [skip ci]"
            git push https://x-access-token:${PAT}@github.com/${{ github.repository }}.git HEAD:logs
          else
            echo "No changes to commit"
          fi

      - name: Delete log artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            full-log-*
            issues-log-*
          failOnError: false
